<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account · NoticeHub</title>
  <meta name="description" content="Create a NoticeHub account to post, edit, and schedule notices on your digital notice board.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='9' r='6.5' fill='%23C83222'/%3E%3Ccircle cx='9.8' cy='6.8' r='2' fill='rgba(255,255,255,.55)'/%3E%3Crect x='11.4' y='14.5' width='1.2' height='6' rx='.6' fill='%232A2017'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Caveat:wght@500;700&family=Karla:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/public/index.css">
  <link rel="stylesheet" href="../../css/auth/signup.css">
</head>
<body>
  <a class="skip-link" href="#signup-form">Skip to sign up</a>

  <main class="signup-shell" id="main">
    <div class="signup-frame">
      <a class="wordmark" href="../../index.html" aria-label="NoticeHub home">
        <svg class="wordmark-pin" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="9" r="6.5" fill="#C83222"></circle>
          <circle cx="9.8" cy="6.8" r="2" fill="rgba(255,255,255,.55)"></circle>
          <rect x="11.4" y="14.5" width="1.2" height="6" rx=".6" fill="#2A2017"></rect>
        </svg>
        noticehub
      </a>

      <div class="signup-card">
        <span class="card-pin" aria-hidden="true"></span>
        <aside class="card-sticky" aria-hidden="true">your board&rsquo;s waiting &rarr;</aside>

        <p class="signup-eyebrow">join the board</p>
        <h1 class="signup-title">Claim your board.</h1>
        <p class="signup-sub">Create an account to post, edit, and schedule notices.</p>

        <div id="signup-form" action="../private/user/dashboard.html" method="get">
          <div class="field">
            <label class="field-label" for="name">Full name</label>
            <input type="text" id="fullName" name="name" autocomplete="name" placeholder="Ada Lovelace" minlength="2" required>
          </div>

          <div class="field">
            <label class="field-label" for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
          </div>

          <div class="field-row">
            <div class="field">
              <div class="field-head">
                <label class="field-label" for="password">Password</label>
                <span class="field-hint">6+ characters</span>
              </div>
              <input type="password" id="password" name="password" autocomplete="new-password" placeholder="At least 6 characters" minlength="6" required>
            </div>

            <div class="field">
              <label class="field-label" for="password2">Confirm password</label>
              <input type="password" id="password2" name="password2" autocomplete="new-password" placeholder="Repeat your password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-block" onclick="signupFlow()">Create account</button>

          <div class="form-divider"><span>or</span></div>

          <p class="form-alt">Already have an account? <a href="login.html">Log in</a></p>
          <p class="signup-foot">Free to read &middot; posting takes under a minute</p>
        </div>
      </div>
    </div>
  </main>
</body>
<script type="module" src="../../js/auth/signup.js"></script>
</html>
